name: Android APK

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision-android
      - name: Build and verify the APK
        shell: bash
        env:
          # The downloaded APK uses HTTPS for remote reader connections.
          TRALENS_HTTP_HOSTS: ''
        run: |
          frontend/android/build-apk --online
          install -m 0644 .android-build/outputs/tralens-debug.apk "$RUNNER_TEMP/tralens-debug.apk"
          frontend/android/android-env apksigner verify "$RUNNER_TEMP/tralens-debug.apk"
      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tralens-android-debug
          path: ${{ runner.temp }}/tralens-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify the versioned release build
        env:
          TRALENS_ANDROID_VERSION_CODE: '2'
          TRALENS_ANDROID_VERSION_NAME: '0.1.0-beta.1'
        run: frontend/android/build-apk --online --release
