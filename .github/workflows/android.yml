name: Android APK

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and verify the APK
        shell: bash
        env:
          # The downloaded APK uses HTTPS for remote reader connections.
          TRALENS_HTTP_HOSTS: ''
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export GRADLE_HOME="$RUNNER_TEMP/gradle-8.11.1"
          distribution="$GRADLE_HOME-bin.zip"
          curl --fail --silent --show-error --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            --output "$distribution"
          printf '%s  %s\n' \
            f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6 \
            "$distribution" | sha256sum --check
          unzip -q "$distribution" -d "$RUNNER_TEMP"
          frontend/android/provision
          frontend/android/build-apk --online
          install -m 0644 .android-build/outputs/tralens-debug.apk "$RUNNER_TEMP/tralens-debug.apk"
          frontend/android/android-env apksigner verify "$RUNNER_TEMP/tralens-debug.apk"
      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tralens-android-debug
          path: ${{ runner.temp }}/tralens-debug.apk
          if-no-files-found: error
          retention-days: 7
