name: Reader checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux tools and the locked backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core poppler-utils util-linux libgl1 libraqm0
          python3 -m venv "$RUNNER_TEMP/uv-tools"
          "$RUNNER_TEMP/uv-tools/bin/pip" install uv==0.13.9
          "$RUNNER_TEMP/uv-tools/bin/uv" sync --locked --group inpainting --python "$(cat .python-version)"
      - name: Check reader and run backend tests
        env:
          PYTHONPATH: backend/src
          TRALENS_STATE_ROOT: ${{ runner.temp }}/tralens-state
        run: |
          node --input-type=module --check < frontend/web/reader.js
          .venv/bin/python -m unittest discover -s tests -q

  container:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/container.yml
    with:
      publish: false

  publish:
    if: github.event_name == 'push' && github.repository == 'nuuenkdaniel/tralens'
    needs: clean-install
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      publish: true
