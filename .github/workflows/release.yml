name: Stage public beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing beta tag on main, such as v0.1.0-beta.1
        required: true
        type: string
      digest:
        description: Main image digest from a successful Reader checks run
        required: true
        type: string
      approved:
        description: The candidate passed the licensing and live translation checklist
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: tralens-public-release
  queue: max

jobs:
  stage:
    if: github.repository == 'nuuenkdaniel/tralens' && github.ref == 'refs/heads/main' && inputs.approved
    environment: public-beta
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ inputs.version }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require configured reviewers and identify the source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/public-beta" |
            jq -e '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' >/dev/null
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          revision=$(git rev-parse --verify "refs/tags/$VERSION^{commit}")
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main
          printf 'RELEASE_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
      - name: Verify the candidate pulled by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git checkout --detach "$RELEASE_REVISION"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          export TRALENS_IMAGE="ghcr.io/$GITHUB_REPOSITORY@$DIGEST"
          docker pull --platform linux/amd64 "$TRALENS_IMAGE"
          bash deploy/smoke-compose.sh
      - name: Stage the verified digest and its Compose bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash deploy/promote-release.sh "$VERSION" "$DIGEST" "$RELEASE_REVISION"

          bundle=$(mktemp -d)
          cp compose.yml .env.example "$bundle/"
          image="ghcr.io/$GITHUB_REPOSITORY-release@$DIGEST"
          printf '\nTRALENS_IMAGE=%s\n' "$image" >> "$bundle/.env.example"
          archive="tralens-compose-$VERSION.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$bundle" compose.yml .env.example
          sha256sum "$archive" > "$archive.sha256"

          notes=$(mktemp)
          {
            printf 'Image for Linux x86-64: `%s`\n\n' "$image"
            printf 'Extract the Compose bundle and follow the [setup guide](%s/%s/tree/%s#start-the-reader).\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION"
            printf 'Verify a clean anonymous pull before publishing this prerelease. See the [release checklist](%s/%s/blob/%s/docs/releasing.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION"
          } > "$notes"
          if gh release view "$VERSION" --json isDraft >/dev/null 2>&1; then
            if [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" == true ]]; then
              gh release upload "$VERSION" "$archive" "$archive.sha256" --clobber
            fi
          else
            gh release create "$VERSION" "$archive" "$archive.sha256" --verify-tag \
              --draft --prerelease --title "Tralens $VERSION" --notes-file "$notes"
          fi
          printf '\n- `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
