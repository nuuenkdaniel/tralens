name: Resolve Python 3.12 lock

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'codex/first-beta' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve the supported runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-tools"
          "$RUNNER_TEMP/uv-tools/bin/pip" install uv==0.13.9
          sed -i 's/==3\.10\.\*/==3.12.*/; s/Pillow>=12\.3\.0,<13/Pillow>=13.0.0,<14/' pyproject.toml
          printf '3.12\n' > .python-version
          "$RUNNER_TEMP/uv-tools/bin/uv" lock --python 3.12
          "$RUNNER_TEMP/uv-tools/bin/uv" lock --check --python 3.12
          gzip -n -c uv.lock | base64 -w 512 | sed 's/^/TRALENS_LOCK_ARCHIVE /'
