name: Reader container

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: tralens-image-${{ github.ref }}
      queue: max
    env:
      TRALENS_IMAGE: tralens:ci
      TRALENS_FRONTIER_PROVIDER: disabled
      REGISTRY_IMAGE: ghcr.io/nuuenkdaniel/tralens
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        if: inputs.publish && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Build the Linux image
        run: |
          docker compose config --quiet
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.documentation=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            --tag "$TRALENS_IMAGE" .
      - name: Test model setup, reader startup, and real CPU OCR
        shell: bash
        run: |
          export TRALENS_UID="$(id -u)" TRALENS_GID="$(id -g)"
          install -d -m 700 tralens-data/{library,config,state,models,assets}
          trap 'docker compose logs --no-color reader; docker compose down' EXIT
          docker compose run --rm --pull never setup
          docker compose up -d --wait --wait-timeout 90 --pull never
          curl -fsS http://127.0.0.1:7871/healthz
          export TRALENS_ORIGIN=https://tralens.example
          (umask 077; openssl rand -hex 32 > tralens-data/config/owner.key)
          docker compose up -d --wait --wait-timeout 90 --pull never
          docker compose exec -T reader python - < tests/compose_smoke.py
      - name: Publish verified image
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          publish_tag() {
            local ref="$REGISTRY_IMAGE:$1"
            docker tag "$TRALENS_IMAGE" "$ref"
            docker push "$ref"
            printf '\n- `%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
          }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            publish_tag "$GITHUB_REF_NAME"
          else
            if [[ "$GITHUB_REF_NAME" == dev ]]; then
              REGISTRY_IMAGE="${REGISTRY_IMAGE}-dev"
            fi
            publish_tag "$GITHUB_REF_NAME-$GITHUB_SHA"
            branch_tip=$(git ls-remote --exit-code origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
            if [[ "$branch_tip" == "$GITHUB_SHA" ]]; then
              publish_tag "$GITHUB_REF_NAME"
            fi
          fi
