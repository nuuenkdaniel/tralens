name: Reader container

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: tralens-image-${{ github.ref }}
      queue: max
    env:
      TRALENS_IMAGE: tralens:ci
      TRALENS_FRONTIER_PROVIDER: disabled
      REGISTRY_IMAGE: ghcr.io/nuuenkdaniel/tralens
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the Linux image
        run: |
          docker compose --profile ollama --profile setup config --quiet
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.documentation=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            --tag "$TRALENS_IMAGE" .
      - name: Test bundled OCR, reader accounts, and backup restoration
        run: bash deploy/smoke-compose.sh
      - name: Publish verified image
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          publish_tag() {
            local ref="$REGISTRY_IMAGE:$1"
            local output digest
            docker tag "$TRALENS_IMAGE" "$ref"
            output=$(docker push "$ref" | tee /dev/stderr)
            digest=$(awk '/ digest: sha256:/ { print $(NF-2) }' <<< "$output")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '\n- `%s` at `%s`\n' "$ref" "$digest" >> "$GITHUB_STEP_SUMMARY"
          }
          if [[ "$GITHUB_REF_NAME" == dev ]]; then
            REGISTRY_IMAGE="${REGISTRY_IMAGE}-dev"
          fi
          publish_tag "$GITHUB_REF_NAME-$GITHUB_SHA"
          branch_tip=$(git ls-remote --exit-code origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [[ "$branch_tip" == "$GITHUB_SHA" ]]; then
            publish_tag "$GITHUB_REF_NAME"
          fi
