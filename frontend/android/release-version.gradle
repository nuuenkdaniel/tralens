gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        project.androidComponents.finalizeDsl { android ->
            android.defaultConfig.versionCode = System.getenv('TRALENS_ANDROID_VERSION_CODE').toInteger()
            android.defaultConfig.versionName = System.getenv('TRALENS_ANDROID_VERSION_NAME')
        }
    }
}
