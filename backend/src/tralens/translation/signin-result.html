<!doctype html>
<html lang="en" data-result="{{state}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}} · Tralens</title>
<script nonce="{{nonce}}">history.replaceState(null, "", "/auth/result");</script>
<style nonce="{{nonce}}">
:root {color-scheme:light dark;--bg:#f1f6f3;--card:#fff;--line:#d0e0d8;--text:#162c25;--dim:#485f55;--mark:#98e0c7;--accent:#147352}
@media(prefers-color-scheme:dark){:root{--bg:#121a18;--card:#1b2622;--line:#35473f;--text:#eef6f1;--dim:#b0c3b9;--accent:#8bddbb}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}
main{width:min(100%,30rem);background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 52px #081d1410;overflow:hidden}
header{padding:22px 30px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;letter-spacing:-.04em}
.mark{display:inline-grid;position:relative;place-items:center;width:32px;height:32px;padding-right:6px;background:var(--mark);color:#163a2c;border-radius:9px;font-size:19px;line-height:1}
.mark b{position:absolute;right:3px;bottom:3px;font-size:11px}
section{padding:32px clamp(22px,6vw,36px) 38px}
.status{display:grid;place-items:center;width:44px;height:44px;margin-bottom:21px;border:1px solid var(--line);border-radius:50%;color:var(--accent);font-size:24px;font-weight:600}
[data-result="error"] .status{color:#ba7241}
h1{margin:0 0 10px;font-size:clamp(1.7rem,5vw,2.15rem);line-height:1.12;letter-spacing:-.05em}
p{margin:0;color:var(--dim);max-width:38ch}
</style>
</head>
<body>
<main>
<header><span class="mark" aria-hidden="true">文<b>A</b></span>Tralens</header>
<section><span class="status" aria-hidden="true">{{symbol}}</span>
<h1>{{title}}</h1><p>{{message}}</p></section>
</main>
</body></html>
