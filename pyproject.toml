[project]
name = "tralens"
version = "0.1.0"
description = "Tool to extract, translate, and replace text in an image"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = "==3.10.*"
dependencies = [
    "PyJWT[crypto]>=2.10.1,<3",
    "ollama>=0.6.1",
    "paddleocr[doc-parser]>=3.4.0",
    "paddlepaddle-gpu==3.4.0.post20260612+99af93f9466",
    "scikit-learn>=1.7.2",
]

[[tool.uv.index]]
name = "paddle-gpu-index"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-gpu-index" }

