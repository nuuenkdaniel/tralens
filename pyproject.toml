[project]
name = "tralens"
version = "0.1.0"
description = "Tool to extract, translate, and replace text in an image"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "Pillow>=13.0.0,<14",
    "PyJWT[crypto]>=2.10.1,<3",
    "python-multipart>=0.0.22,<1",
    "paddleocr==3.7.0",
    "paddlex[ocr]==3.7.2",
    "paddlepaddle==3.3.1",
    "opencv-contrib-python==4.10.0.84",
    "scikit-learn>=1.7.2",
    "fugashi>=1.5.2,<2",
    "jaconv>=0.5,<1",
    "unidic-lite==1.0.8",
]

[dependency-groups]
inpainting = ["onnxruntime==1.23.2"]

[tool.uv]
# 0.3.9 is the first release with a published redistribution license.
constraint-dependencies = ["aistudio-sdk>=0.3.9"]
