[project]
name = "tralens"
version = "0.1.0"
description = "Tool to extract, translate, and replace text in an image"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = "==3.10.*"
dependencies = [
    "PyJWT[crypto]>=2.10.1,<3",
    "ollama>=0.6.1",
    "paddleocr==3.7.0",
    "paddlex[ocr]==3.7.2",
    "paddlepaddle==3.3.1",
    "opencv-contrib-python==4.10.0.84",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
inpainting = ["onnxruntime==1.23.2"]
